services:
  database:
    image: postgres:18.3-alpine
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 15s

  migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DB_HOST=database
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      # - PYTHONPATH=/app/src    
    networks:
      - internal

  redis:
    image: redis:8.4.2-alpine3.22
    networks:
      - internal
    command:
      [
        "redis-server",
        "--requirepass", "${REDIS_PASSWORD}"
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - internal

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - celery
      - --app=infrastructure.polling.celery:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    networks:
      - internal

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - celery
      - --app=infrastructure.polling.celery:celery_app
      - beat
      - --loglevel=INFO
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
